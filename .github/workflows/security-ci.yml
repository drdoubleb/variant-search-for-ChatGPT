name: Node tests and dependency security

on:
  pull_request:
  push:
    branches: [main]
  # Recheck dependencies even if no one pushes new code.
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install exactly locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Run unit and input-security regression tests
        run: npm test
      - name: Check production dependency advisories (high and critical)
        run: npm audit --omit=dev --audit-level=high

name: ClinVar evidence workbench
on:
  push:
    branches: [work/clinvar-evidence-build-20261124]
    paths: [.github/workflows/clinvar-evidence-workbench.yml]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36ee3a540beb88f4a1d05a04ea0aef461fb74999
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned parser and test dependencies
        run: |
          npm ci --ignore-scripts
          npm install --save-exact --ignore-scripts fast-xml-parser@5.12.1
          mkdir -p /tmp/evidence-dependencies
          tar -czf /tmp/evidence-dependencies/dependencies.tar.gz node_modules package.json package-lock.json
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: clinvar-evidence-dependencies
          path: /tmp/evidence-dependencies
          retention-days: 1

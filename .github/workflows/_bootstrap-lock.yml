# Temporary bootstrap: generate a real npm lockfile using GitHub's npm access.
# Removed from the final pull-request diff after the lockfile is committed.
name: Bootstrap npm lockfile
on:
  push:
    branches:
      - security/npm-ci-validation-20261023
    paths:
      - .github/workflows/_bootstrap-lock.yml
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve npm dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export generated lockfile to job log
        run: |
          echo "BEGIN_REVIEW_LOCKFILE_BASE64"
          base64 -w0 package-lock.json
          echo
          echo "END_REVIEW_LOCKFILE_BASE64"
